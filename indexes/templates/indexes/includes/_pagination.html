{% if events.paginator.num_pages > 1 %}
<nav aria-label="Pagination" class="pagination">
  {% if events.has_previous %}
    <a href="?{{ query_string }}&page={{ events.previous_page_number }}"
       hx-get="?{{ query_string }}&page={{ events.previous_page_number }}"
       hx-target="#change-list"
       hx-push-url="true"
       class="pagination-link">Previous</a>
  {% endif %}
  <span class="pagination-info">Page {{ events.number }} of {{ events.paginator.num_pages }}</span>
  {% if events.has_next %}
    <a href="?{{ query_string }}&page={{ events.next_page_number }}"
       hx-get="?{{ query_string }}&page={{ events.next_page_number }}"
       hx-target="#change-list"
       hx-push-url="true"
       class="pagination-link">Next</a>
  {% endif %}
</nav>
{% endif %}
