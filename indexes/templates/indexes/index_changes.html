{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Index Changes - Earnings Radar</title>
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #1a1a2e; background: #f5f5f7; }
    .container { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
    h1 { font-size: 1.5rem; margin-bottom: 1rem; color: #16213e; }
    .filters { background: #fff; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; border: 1px solid #e0e0e0; display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: flex-end; }
    .filters label { font-size: 0.8rem; display: block; color: #555; margin-bottom: 0.15rem; }
    .filters select, .filters input { padding: 0.35rem 0.5rem; border: 1px solid #ccc; border-radius: 4px; font-size: 0.85rem; }
    .filters button { padding: 0.35rem 1rem; background: #16213e; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
    .filters button:hover { background: #0f3460; }
    .filters a { font-size: 0.85rem; color: #666; text-decoration: none; padding: 0.35rem 0; }
    .filters a:hover { text-decoration: underline; }
    .filter-group { display: flex; flex-direction: column; }
    .change-table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; border: 1px solid #e0e0e0; }
    .change-table th { background: #16213e; color: #fff; padding: 0.6rem 0.75rem; text-align: left; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .change-table td { padding: 0.6rem 0.75rem; border-bottom: 1px solid #eee; font-size: 0.85rem; vertical-align: top; }
    .change-table tr:last-child td { border-bottom: none; }
    .change-table tr:hover { background: #f9f9fb; }
    .badge { display: inline-block; padding: 0.15rem 0.45rem; border-radius: 3px; font-size: 0.72rem; font-weight: 600; }
    .badge.upcoming { background: #e8f5e9; color: #2e7d32; }
    .badge.added { background: #e3f2fd; color: #1565c0; }
    .badge.removed { background: #fce4ec; color: #c62828; }
    .badge.cancelled { background: #fff3e0; color: #e65100; }
    .badge.corrected { background: #f3e5f5; color: #6a1b9a; }
    .badge.displacement.upgrade { background: #e8f5e9; color: #2e7d32; }
    .badge.displacement.downgrade { background: #fce4ec; color: #c62828; }
    .badge.displacement.cross_index { background: #fff8e1; color: #f57f17; }
    .badge.impact { background: #e8eaf6; color: #283593; }
    .leg-entry { display: block; }
    .correlation-info { margin-top: 0.3rem; }
    .correlation-note { display: block; font-size: 0.75rem; color: #666; font-style: italic; }
    .empty-state { text-align: center; padding: 3rem 1rem; color: #888; font-size: 1rem; }
    .pagination { display: flex; justify-content: center; align-items: center; gap: 1rem; padding: 1rem; }
    .pagination-info { color: #666; font-size: 0.85rem; }
    .pagination-link { color: #16213e; text-decoration: none; padding: 0.3rem 0.75rem; border: 1px solid #ccc; border-radius: 4px; font-size: 0.85rem; }
    .pagination-link:hover { background: #eee; }
    @media (max-width: 640px) {
      .container { padding: 0.75rem; }
      .filters { flex-direction: column; }
      .change-table { font-size: 0.8rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Index Changes</h1>

    <form method="get" action="{% url 'indexes:index_changes' %}"
          hx-get="{% url 'indexes:index_changes' %}"
          hx-target="#change-list"
          hx-push-url="true"
          class="filters">
      <div class="filter-group">
        <label for="filter-index">Index</label>
        <select name="index" id="filter-index">
          <option value="">All Indexes</option>
          {% for code in index_choices %}
            <option value="{{ code }}" {% if filters.index == code %}selected{% endif %}>{{ code }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="filter-group">
        <label for="filter-action">Action</label>
        <select name="action" id="filter-action">
          <option value="">All Actions</option>
          {% for val in action_choices %}
            <option value="{{ val }}" {% if filters.action == val %}selected{% endif %}>{{ val|title }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="filter-group">
        <label for="filter-displacement">Displacement</label>
        <select name="displacement" id="filter-displacement">
          <option value="">All</option>
          {% for val in displacement_choices %}
            <option value="{{ val }}" {% if filters.displacement == val %}selected{% endif %}>{{ val|title }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="filter-group">
        <label for="filter-from">From</label>
        <input type="date" name="from" id="filter-from" value="{{ filters.from_date|date:'Y-m-d'|default:'' }}">
      </div>
      <div class="filter-group">
        <label for="filter-to">To</label>
        <input type="date" name="to" id="filter-to" value="{{ filters.to_date|date:'Y-m-d'|default:'' }}">
      </div>
      <div class="filter-group">
        <label for="filter-history">History</label>
        <select name="history" id="filter-history">
          <option value="0" {% if not filters.include_cancelled_corrected %}selected{% endif %}>Current Only</option>
          <option value="all" {% if filters.include_cancelled_corrected %}selected{% endif %}>Include History</option>
        </select>
      </div>
      <button type="submit">Filter</button>
      <a href="{% url 'indexes:index_changes' %}">Clear</a>
    </form>

    {% include "indexes/_index_changes_list.html" %}
  </div>
</body>
</html>
